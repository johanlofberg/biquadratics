name: Verify second order Zarankiewicz computations

on:
  push:
    paths:
      - 'second_order_zarankiewicz_numbers/**'
      - '.github/workflows/verify-second-order.yml'
  pull_request:
    paths:
      - 'second_order_zarankiewicz_numbers/**'
      - '.github/workflows/verify-second-order.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: second_order_zarankiewicz_numbers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/verify_manifest.py
      - run: python -m unittest discover -s tests -v
      - run: python reproduce.py verify
      - run: python reproduce.py all --reference --research
      - run: python scripts/verify_cpp.py
      - run: python scripts/build_tables.py
      - run: git diff --exit-code -- paper/computational_data.tex paper/benchmark_data.tex
